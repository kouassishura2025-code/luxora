name: luxora
description: "LUXORA — Chauffeur privé & conciergerie de luxe."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3

  # Réseau
  dio: ^5.5.0

  # Cartographie OpenStreetMap
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  http: ^1.2.0

  # UI / UX premium
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Utilitaires
  intl: ^0.19.0
  equatable: ^2.0.5
  get_it: ^7.7.0
  logger: ^2.4.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.2.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/vehicles/
    - assets/images/onboarding/
    - assets/images/app_icon/
    - assets/icons/
    - assets/icons/logo/
    - assets/lottie/
    - assets/i18n/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont.ttf
