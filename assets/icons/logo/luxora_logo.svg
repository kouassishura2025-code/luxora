<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cercle extérieur fin -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#C9A24B" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Cercle médian -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#C9A24B" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Cercle intérieur -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A24B" stroke-width="0.8" opacity="0.8"/>
  
  <!-- Monogramme L stylisé -->
  <path d="M 74 60 L 74 132 L 122 132" 
        fill="none" 
        stroke="#C9A24B" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Barre verticale dorée (accent) -->
  <line x1="128" y1="72" x2="128" y2="98" stroke="#E3C77A" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Trait or horizontal sous le L -->
  <line x1="86" y1="148" x2="114" y2="148" stroke="#C9A24B" stroke-width="0.8" opacity="0.7"/>
  
  <!-- Point doré signature -->
  <circle cx="100" cy="160" r="1.6" fill="#C9A24B"/>
  
  <!-- Petits accents décoratifs -->
  <circle cx="142" cy="72" r="1.2" fill="#E3C77A" opacity="0.8"/>
  <circle cx="146" cy="80" r="0.7" fill="#C9A24B" opacity="0.5"/>
  <circle cx="140" cy="88" r="0.5" fill="#C9A24B" opacity="0.4"/>
</svg>
