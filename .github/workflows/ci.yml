name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage --reporter expanded
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stub google-services.json
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"ci-stub","storage_bucket":"ci-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.luxora.luxora"}},"oauth_client":[],"api_key":[{"current_key":"stub"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - name: Stub firebase_options.dart
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "// CI stub" > lib/firebase_options.dart
            echo "// ignore_for_file: type=lint" >> lib/firebase_options.dart
            echo "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;" >> lib/firebase_options.dart
            echo "class DefaultFirebaseOptions { static FirebaseOptions get currentPlatform => throw UnimplementedError(); }" >> lib/firebase_options.dart
          fi
      - run: flutter build apk --debug -t lib/main_dev.dart
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: warn

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android]
    if: always()
    steps:
      - name: Verify all jobs
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "Analyze a echoue"
            exit 1
          fi
          if [ "${{ needs.build-android.result }}" != "success" ]; then
            echo "Build Android a echoue"
            exit 1
          fi
          echo "CI passee"
