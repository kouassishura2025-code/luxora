name: CD - Staging

on:
  push:
    branches: [develop]
    tags: ["v*.*.*-rc*"]
  workflow_dispatch:

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
        continue-on-error: true

  build-android-staging:
    name: Build APK staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Stub google-services.json
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"ci-stub","storage_bucket":"ci-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.luxora.luxora"}},"oauth_client":[],"api_key":[{"current_key":"stub"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - name: Stub firebase_options.dart
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "// CI stub" > lib/firebase_options.dart
            echo "// ignore_for_file: type=lint" >> lib/firebase_options.dart
            echo "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;" >> lib/firebase_options.dart
            echo "class DefaultFirebaseOptions { static FirebaseOptions get currentPlatform => throw UnimplementedError(); }" >> lib/firebase_options.dart
          fi
      - name: Build APK (release)
        run: |
          flutter build apk \
            --release \
            -t lib/main_dev.dart \
            --build-number=${{ github.run_number }}
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/luxora-staging-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luxora-staging-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/luxora-staging-*.apk
          retention-days: 30
