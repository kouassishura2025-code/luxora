name: CD - Staging

on:
  push:
    branches: [develop]
    tags: ["v*.*.*-rc*"]
  workflow_dispatch:

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
        continue-on-error: true

  build-android-staging:
    name: Build APK staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore google-services.json
        run: |
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
          fi
      - name: Restore firebase_options.dart
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_B64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
          fi
      - run: |
          flutter build apk \
            --release \
            -t lib/main_dev.dart \
            --build-number=${{ github.run_number }}
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/luxora-staging-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luxora-staging-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/luxora-staging-*.apk
          retention-days: 30
